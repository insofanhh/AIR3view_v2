name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        shell: powershell
        run: ./scripts/setup-tools.ps1
      - name: Rust tests and Clippy
        shell: powershell
        run: |
          ./scripts/build.cmd test --release --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build.cmd clippy --release --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package
        shell: powershell
        run: |
          ./scripts/build.cmd build --release --bins --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ((Get-Content Cargo.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1) -split '"')[1]
          $tag = 'v' + $version
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read remote release tags' }
          if ($existingTag) { $tag += '-build.' + $env:GITHUB_RUN_NUMBER }
          ./scripts/package.ps1 -SkipBuild -Archive -ReleaseTag $tag
          ./scripts/package-source.ps1
          "AIR3VIEW_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify packaged render
        shell: powershell
        run: ./scripts/verify-release.ps1 -PackagePath ./dist/AIR3view
      - name: Verify fresh Python, real TTS and local avatar
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:REACTION_DATA_DIR = Join-Path $env:RUNNER_TEMP 'native-startup-data'
          $env:AIR3VIEW_SHORTCUT_ROOT = Join-Path $env:RUNNER_TEMP 'native-shortcuts'
          $env:REACTION_MODEL_CACHE = Join-Path $env:RUNNER_TEMP 'regular-model-cache'
          $report = Join-Path $env:RUNNER_TEMP 'native-startup.json'
          $app = Start-Process -FilePath ./dist/AIR3view/AIR3view.exe -ArgumentList ('--verify-startup="' + $report + '"') -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(1200000)) { throw 'Native bootstrap timed out' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'Native bootstrap did not produce a report' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($app.ExitCode -ne 0 -or $result.status -ne 'ready' -or -not $result.owned_worker) {
            Get-Content -LiteralPath (Join-Path $env:REACTION_DATA_DIR 'logs/startup.log') -Tail 50
            throw ('Native bootstrap failed: ' + ($result | ConvertTo-Json -Compress))
          }
          Write-Host 'Native EXE bootstrap PASS: managed Python, worker health, shortcuts and lifecycle.'
          ./scripts/verify-workers.ps1 -PackagePath ./dist/AIR3view
      - name: Publish release after verification
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem dist -Filter '*.zip' -File)
          $lines = foreach ($file in $files) { (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $file.Name }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ASCII
          gh release create $env:AIR3VIEW_TAG @($files.FullName) dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AIR3view $env:AIR3VIEW_TAG" --notes-file .github/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release edit $env:AIR3VIEW_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
