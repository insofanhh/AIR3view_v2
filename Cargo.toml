[package]
name = "reaction-studio"
version = "0.2.14"
edition = "2021"
rust-version = "1.85"
default-run = "reaction-studio"

[dependencies]
anyhow = "1.0"
ab_glyph = "0.2"
base64 = "0.22"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
url = "2.5"
tempfile = "3.14"
whatlang = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
debug = 0
strip = true
